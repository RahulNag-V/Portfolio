<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Rahul Nag V" />

  <title>Portfolio Terminal</title>

  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="terminal.css" />
</head>

<body>

  <!-- Boot Screen -->
  <section id="boot-screen">
    <pre id="boot-text"></pre>
  </section>

  <!-- Main Content -->
  <main id="main-content" hidden>

    <!-- Left Panel -->
    <section id="main-content-left">
      <h1>
        <span class="dim">&gt;&gt;</span>
        <span class="name">Welcome to my interactive web terminal</span>
      </h1>

      <p class="hint">Type <code>help</code> to see available commands.</p>

      <div id="terminal" class="terminal"></div>
    </section>

    <!-- Right Panel -->
    <section id="main-content-right"></section>

  </main>

  <script src="terminal.js" defer></script>
</body>
</html>
